<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE DIAGNÓSTICO | TRIAGE</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/diagnostico.css">
</head>
<body>

    <div class="crt-overlay"></div>

    <a href="index.html" class="back-btn">CANCELAR OPERACIÓN</a>

    <div class="terminal-container" style="margin-top: 60px;">
        <h1>SISTEMA DE DIAGNÓSTICO v.4.0</h1>
        
        <div id="step1" class="question-box active">
            <p style="margin-bottom: 20px;">[SISTEMA]: ESTADO ACTUAL DEL SUJETO:</p>
            <button class="btn-option" onclick="nextStep(2)">A. MI NEGOCIO SOBREVIVE</button>
            <button class="btn-option" onclick="nextStep(2)">B. QUIERO DOMINACIÓN TOTAL</button>
        </div>

        <div id="step2" class="question-box">
            <p style="margin-bottom: 20px;">[SISTEMA]: IDENTIFIQUE SU OBJETIVO O PUNTO DE FALLO CRÍTICO:</p>
            <button class="btn-option" onclick="finalize('web')">1. SOY INVISIBLE (PRESENCIA WEB)</button>
            <button class="btn-option" onclick="finalize('redes')">2. NO TENGO ALCANCE (REDES SOCIALES)</button>
            <button class="btn-option" onclick="finalize('ecommerce')">3. NO VENDO EN LÍNEA (E-COMMERCE ÉLITE)</button>
            <button class="btn-option" onclick="finalize('ia')">4. SOY LENTO (SOLUCIONES IA)</button>
            <button class="btn-option" onclick="finalize('sec')">5. SOY VULNERABLE (FORTALEZA / SEGURIDAD)</button>
            <button class="btn-option" onclick="finalize('catalog')">6. QUIERO VER TODO EL ARSENAL (CATÁLOGO COMPLETO)</button>
            <button class="btn-option" onclick="finalize('top10')">7. BUSCO EL TOP 10 DE APPS DE ÉLITE</button>
            <button class="btn-option" onclick="finalize('black')">8. REQUIERO ACCESO VIP RESTRINGIDO (MEMBRESÍA BLACK)</button>
            <button class="btn-option" onclick="finalize('makumoto')">9. DESARROLLO A MEDIDA / RED SOCIAL (MAKUMOTO)</button>
        </div>

        <div id="loading" class="question-box">
            <p>CALCULANDO RUTA ÓPTIMA...</p>
            <div class="loader" id="bar"></div>
        </div>
    </div>

    <div class="hyperspace-overlay" id="warp">
        <div class="warp-speed">EJECUTANDO...</div>
    </div>

    <script src="js/diagnostico.js"></script>
</body>
</html>
